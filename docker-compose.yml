# Infraestructura local de SITU: `pnpm infra:up`
name: situ

services:
  postgres:
    image: postgis/postgis:17-3.5
    # Official tags are amd64-only; Apple Silicon runs this image under emulation.
    platform: linux/amd64
    environment:
      POSTGRES_USER: situ
      POSTGRES_PASSWORD: situ_dev
      POSTGRES_DB: situ
    ports:
      - "5433:5432"
    volumes:
      - situ-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U situ -d situ"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Correos de prueba (confirmación de correo, recuperación de contraseña, firma digital del representante).
  # Bandeja web: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Almacenamiento S3 compatible para imágenes y videos. Consola: http://localhost:9001
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: situ
      MINIO_ROOT_PASSWORD: situ_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - situ-minio:/data

volumes:
  situ-postgres:
  situ-minio:
