# Sitio independiente de live.somossitu.com.
# Pégalo en /etc/nginx/sites-available/situ-live y enlázalo en sites-enabled.
# No toca el MediaMTX que ya escucha en 1935, 18888 y 19997.
#
# El certificado es el que ya usa el resto de SITU. Antes de recargar nginx,
# añade este nombre SIN crear otro certificado:
#
#   sudo certbot certonly --cert-name somossitu.com --expand \
#     -d somossitu.com -d www.somossitu.com -d api.somossitu.com \
#     -d app.somossitu.com -d admin.somossitu.com -d ayuda.somossitu.com \
#     -d live.somossitu.com
#
# Sustituye __HLS_CDN_SECRET__ por HLS_CDN_SECRET de /etc/situ/live.env.
# Ese valor no se imprime. nginx lo manda solo a MediaMTX en localhost.
# La validez del token HMAC la decide la API en 127.0.0.1:15080.
#
# auth_request no hereda $arg_token: dentro de /_live_token esa variable va vacía.
# $request_uri sí es la petición original. El mapa saca el token de ahí
# (segmento /hls/{id}/{token}/... o ?token=). El access_log no guarda la URI.
# No hay cookie: el token vive solo en la ruta.

limit_conn_zone $binary_remote_addr zone=situ_live_hls:1m;

log_format situ_live '$remote_addr [$time_local] $status $request_method hls';

map $request_uri $live_token {
    "~^/hls/[a-f0-9]{32}/([0-9]+\.[0-9a-f]{64})/" $1;
    "~[?&]token=([^&]+)" $1;
    default "";
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name live.somossitu.com;

    ssl_certificate     /etc/letsencrypt/live/somossitu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/somossitu.com/privkey.pem;
    client_max_body_size 1m;
    access_log /var/log/nginx/situ-live.access.log situ_live;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /_live_token {
        internal;
        proxy_pass http://127.0.0.1:15080/internal/live/hls;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Uri $request_uri;
        proxy_set_header X-Live-Token $live_token;
        proxy_set_header Cookie "";
    }

    location /hls/ {
        limit_conn situ_live_hls 12;
        rewrite "^/hls/([a-f0-9]{32})/[0-9]+\.[0-9a-f]{64}/(.*)$" /$1/$2 break;
        rewrite "^/hls/(.*)$" /$1 break;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://app.somossitu.com" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range" always;
            add_header Access-Control-Max-Age 600 always;
            return 204;
        }
        auth_request /_live_token;
        proxy_pass http://127.0.0.1:18890;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 20s;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "Bearer __HLS_CDN_SECRET__";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://app.somossitu.com" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        return 404;
    }
}
